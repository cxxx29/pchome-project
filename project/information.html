<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>补充信息页</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
  <script>
    // 自定义 Tailwind 配置
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: '#FF5A5F', // 主色调：珊瑚红，充满活力，适合众筹/电商
            secondary: '#0FA3B1', // 辅助色：科技蓝，用于按钮和强调
            neutral: '#2A2A2A', // 中性色：深灰，用于主要文字
            'neutral-light': '#8A8A8A', // 中性色：浅灰，用于辅助文字
            background: '#FAFAFA', // 背景色：浅灰，提升页面呼吸感
            success: '#3AA772', // 成功色：绿色
          },
          fontFamily: {
            sans: ['PingFang SC', 'Helvetica Neue', 'Arial', 'sans-serif'],
          },
        },
      }
    }
  </script>
  <style type="text/tailwindcss">
    @layer utilities {
      .content-auto {
        content-visibility: auto;
      }
      .form-input-focus {
        @apply focus:ring-2 focus:ring-secondary/50 focus:border-secondary focus:outline-none;
      }
      .form-error {
        @apply border-red-500 focus:ring-red-200 focus:border-red-500;
      }
      .btn-primary {
        @apply bg-secondary text-white font-bold py-3 px-6 rounded-lg shadow-md hover:bg-secondary/90 active:bg-secondary/80 transition-all duration-200 transform hover:scale-105 active:scale-95;
      }
      .btn-disabled {
        @apply bg-neutral-light/30 text-white/70 cursor-not-allowed shadow-none transform-none;
      }
      .upload-area {
        @apply border-2 border-dashed border-neutral-light/40 rounded-lg p-4 text-center cursor-pointer hover:border-secondary hover:bg-secondary/5 transition-all duration-200;
      }
      .color-swatch {
        @apply w-8 h-8 rounded-full cursor-pointer transition-transform hover:scale-110 border-2 border-transparent hover:border-secondary;
      }
      .color-swatch-selected {
        @apply border-secondary ring-2 ring-secondary/30;
      }
    }
  </style>
</head>
<body class="bg-background font-sans text-neutral min-h-screen">

  <!-- 顶部导航栏 -->
  <nav class="bg-white shadow-sm fixed top-0 left-0 right-0 z-50">
    <div class="max-w-md mx-auto px-4 py-3 flex justify-between items-center">
      <button class="text-neutral-light hover:text-neutral">
        <i class="fa fa-arrow-left text-xl"></i>
      </button>
      <h1 class="text-lg font-bold">作品信息补充</h1>
      <button class="text-neutral-light hover:text-neutral">
        <i class="fa fa-floppy-o text-xl"></i>
      </button>
    </div>
  </nav>

  <!-- 主内容区 -->
  <main class="max-w-md mx-auto px-4 pt-24 pb-20">
    <!-- 1. 身份信息 -->
    <section class="mb-6">
      <div class="flex justify-between items-center bg-white p-4 rounded-lg shadow-sm">
        <div>
          <h2 class="font-semibold">身份信息</h2>
          <p class="text-xs text-neutral-light">点击查看详情</p>
        </div>
        <span class="bg-success/10 text-success text-xs font-bold px-2.5 py-0.5 rounded-full flex items-center">
          <i class="fa fa-check-circle mr-1"></i>已认证
        </span>
      </div>
    </section>

    <!-- 2. 作品信息 -->
    <section class="mb-6 bg-white p-4 rounded-lg shadow-sm">
      <h2 class="font-semibold mb-4">作品信息</h2>
      
      <div class="mb-4">
        <label class="block text-sm font-medium text-neutral-light mb-1">作品名称 *</label>
        <div class="relative">
          <input id="productName" type="text" placeholder="自动识别名称" maxLength="30"

        </div>
        <p id="nameError" class="text-xs text-red-500 mt-1 hidden">作品名称不能超过30个字</p>
      </div>

      <div class="mb-4">
        <label class="block text-sm font-medium text-neutral-light mb-1">作品主图 *</label>
        <div id="mainImageUpload" class="upload-area">
          <i class="fa fa-picture-o text-3xl text-neutral-light mb-2"></i>
          <p class="text-sm text-neutral-light">点击上传图片 (最多上传6张)</p>
          <p class="text-xs text-neutral-light/70 mt-1">格式jpg、png</p>
        </div>
        <label class="block text-sm font-medium text-neutral-light mb-1">作品三视图 *</label>
        <div id="mainImageUpload" class="upload-area">
          <i class="fa fa-picture-o text-3xl text-neutral-light mb-2"></i>

        </div>
        <div id="mainImagePreview" class="mt-2 grid grid-cols-4 gap-2 hidden">
          <div class="relative group">
            <img id="mainImgPreview" src="" alt="主图预览" class="w-full aspect-square object-cover rounded border border-neutral-light/20">
            <button class="absolute top-1 right-1 bg-black/50 text-white rounded-full p-1 opacity-0 group-hover:opacity-100 transition-opacity">
              <i class="fa fa-times"></i>
            </button>
          </div>
        </div>
      </div>

      <div class="mb-4">
        <label class="block text-sm font-medium text-neutral-light mb-1">主颜色</label>
        <p class="text-xs text-neutral-light mb-2">最多3组颜色</p>
        <div class="flex gap-3 mb-3" id="colorSwatches">
          <div class="color-swatch color-swatch-selected" style="background-color: #FF6600;" data-color="#FF6600"></div>
          <div class="color-swatch" style="background-color: #333333;" data-color="#333333"></div>
          <div class="color-swatch" style="background-color: #FFFFFF; border: 1px solid #ddd;" data-color="#FFFFFF"></div>
          <button id="addColor" class="w-8 h-8 rounded-full border-2 border-dashed border-neutral-light flex items-center justify-center text-neutral-light hover:text-secondary hover:border-secondary">
            <i class="fa fa-plus text-xs"></i>
          </button>
        </div>
        <div id="selectedColors" class="flex flex-wrap gap-2">
          <span class="bg-neutral/10 text-sm px-2 py-1 rounded-full flex items-center">
            #FF6600
            <button class="ml-1 text-neutral-light hover:text-red-500">
              <i class="fa fa-times-circle text-xs"></i>
            </button>
          </span>
        </div>
      </div>

      <div class="mb-4">
        <label class="block text-sm font-medium text-neutral-light mb-1">成品尺寸</label>
        <div class="grid grid-cols-3 gap-2">
          <div>
            <input id="productHeight" type="number" placeholder="长" step="0.1" 
                   class="w-full border border-neutral-light/30 rounded-md px-3 py-2 form-input-focus">
            <span class="text-xs text-neutral-light ml-3">cm</span>
          </div>
          <div>
            <input id="productWidth" type="number" placeholder="宽" step="0.1" 
                   class="w-full border border-neutral-light/30 rounded-md px-3 py-2 form-input-focus">
            <span class="text-xs text-neutral-light ml-3">cm</span>
          </div>
          <div>
            <input id="productDepth" type="number" placeholder="高*" step="0.1" 
                   class="w-full border border-neutral-light/30 rounded-md px-3 py-2 form-input-focus">
            <span class="text-xs text-neutral-light ml-3">cm</span>
          </div>
        </div>
        <p class="text-xs text-neutral-light mt-1">公差范围：±5mm</p>
      </div>

      <label class="block text-sm font-medium text-neutral-light mb-1">作品材质说明 *</label>
      <div class="relative">
        <textarea id="designStory" rows="3" placeholder="请输入150字以内的材质说明..." 
                    class="w-full border border-neutral-light/30 rounded-md px-3 py-2 form-input-focus resize-none"></textarea>
        <span id="storyCounter" class="absolute right-3 bottom-2 text-xs text-neutral-light">0/150</span>
      </div>
      <div class="mb-4">
        <label class="block text-sm font-medium text-neutral-light mb-1">包装 *</label>
        <select id="packagingSelect" class="w-full border border-neutral-light/30 rounded-md px-3 py-2 bg-white form-input-focus">
          <option value="">请选择包装方式</option>
          <option value="box">盒子</option>
          <option value="bag">袋子</option>
          <option value="custom">定制包装</option>
        </select>
      </div>
      <!-- <div class="mb-4">
        <label class="block text-sm font-medium text-neutral-light mb-1">材质 *</label>
        <select id="materialSelect" class="w-full border border-neutral-light/30 rounded-md px-3 py-2 bg-white form-input-focus">
          <option value="">请选择材质组合</option>
          <option value="crystal-soft+pp-cotton">水晶超柔+pp棉</option>
          <option value="short-pile+pp-cotton">短绒+pp棉</option>
          <option value="long-pile+pp-cotton">长绒+pp棉</option>
          <option value="crystal-soft+down">水晶超柔+羽绒棉</option>
          <option value="other">其他材质组合</option>
        </select>
        <p class="text-xs text-neutral-light mt-1">从官方材质库选择</p>
      </div> -->

      <div class="mb-4">
        <label class="block text-sm font-medium text-neutral-light mb-1">配件清单</label>
        <div class="flex gap-2">
          <input id="accessoryInput" type="text" placeholder="例如：丝带×1" 
                 class="flex-1 border border-neutral-light/30 rounded-md px-3 py-2 form-input-focus">
          <button id="addAccessory" class="bg-secondary/10 text-secondary px-3 py-2 rounded-md hover:bg-secondary/20 transition-colors">
            <i class="fa fa-plus"></i>
          </button>
        </div>
        <div id="accessoryList" class="mt-2 flex flex-wrap gap-2">
          <!-- 配件将动态添加 -->
        </div>
        <button id="uploadAccessoryImg" class="mt-2 text-sm text-secondary hover:text-secondary/80 flex items-center">
          <i class="fa fa-paperclip mr-1"></i> 上传配件图片
        </button>
      </div>

      <button id="submitBtn" class="btn-primary w-full disabled:btn-disabled" disabled>
        提交
      </button>
    </section>

    <!-- 4. 众筹设置 -->
    <!-- <section class="mb-6 bg-white p-4 rounded-lg shadow-sm">
      <h2 class="font-semibold mb-4">众筹设置</h2>
      
      <div class="grid grid-cols-2 gap-3 mb-3">
        <div>
          <label class="block text-sm font-medium text-neutral-light mb-1">众筹数量 *</label>
          <div class="relative">
            <input id="targetQty" type="number" min="200" value="200" class="w-full border border-neutral-light/30 rounded-md px-3 py-2 form-input-focus">
            <span class="absolute right-3 top-2 text-xs text-neutral-light">≥200件</span>

          <div class="relative">

            <input id="crowdfundPrice" type="number" min="19800" value="20000" class="w-full border border-neutral-light/30 rounded-md pl-8 pr-20 py-2 form-input-focus">
            <span id="minPriceHint" class="absolute right-3 top-2 text-xs text-primary font-semibold">≥¥19800</span>
          </div>

      </div>
    </section> -->

        <label for="agreeTerms" class="text-sm text-neutral-light">我已阅读并同意<a href="#" class="text-secondary">《发起者协议》</a></label>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // DOM元素引用
      const productName = document.getElementById('productName');
      const nameCounter = document.getElementById('nameCounter');
      const nameError = document.getElementById('nameError');
      const agreeTerms = document.getElementById('agreeTerms');
      const submitBtn = document.getElementById('submitBtn');
      const crowdfundPrice = document.getElementById('crowdfundPrice');
      const minPriceHint = document.getElementById('minPriceHint');
      const campaignDays = document.getElementById('campaignDays');
      const estimatedShipDate = document.getElementById('estimatedShipDate');
      const imgUploadArea = document.getElementById('imgUploadArea');
      const imgPreviewContainer = document.getElementById('imgPreviewContainer');
      const fileUploadArea = document.getElementById('fileUploadArea');
      const fileInfoContainer = document.getElementById('fileInfoContainer');
      const fileNameDisplay = document.getElementById('fileNameDisplay');
      const mainImageUpload = document.getElementById('mainImageUpload');
      const mainImagePreview = document.getElementById('mainImagePreview');
      const mainImgPreview = document.getElementById('mainImgPreview');
      const threeViewsUpload = document.getElementById('threeViewsUpload');
      const threeViewsPreview = document.getElementById('threeViewsPreview');
      const designStory = document.getElementById('designStory');
      const storyCounter = document.getElementById('storyCounter');
      const colorSwatches = document.getElementById('colorSwatches');
      const selectedColors = document.getElementById('selectedColors');
      const addColor = document.getElementById('addColor');
      const accessoryInput = document.getElementById('accessoryInput');
      const addAccessory = document.getElementById('addAccessory');
      const accessoryList = document.getElementById('accessoryList');
      const materialSelect = document.getElementById('materialSelect');
      const packagingSelect = document.getElementById('packagingSelect');
      
      // 状态变量
      let isImageUploaded = false;
      let isMainImageUploaded = false;
      let isThreeViewsUploaded = false;
      let selectedColorCount = 1;
      let accessoryCount = 0;

      // 实时校验，控制按钮状态
      const validateForm = () => {
        const isNameValid = productName.value.trim() !== '' && productName.value.length <= 30;
        const isMaterialValid = materialSelect.value !== '';
        const isPackagingValid = packagingSelect.value !== '';
        const isDimensionsValid = document.getElementById('productHeight').value && 
                                 document.getElementById('productWidth').value && 
                                 document.getElementById('productDepth').value;
        
        const isReady = isNameValid && agreeTerms.checked && isImageUploaded && 
                       isMainImageUploaded && isThreeViewsUploaded && 
                       isMaterialValid && isPackagingValid && isDimensionsValid && 
                       selectedColorCount > 0;
        
        submitBtn.disabled = !isReady;
      };

      // 作品名称字数统计
      productName.addEventListener('input', (e) => {
        const length = e.target.value.length;
        nameCounter.textContent = `${length}/30`;
        
        if (length > 30) {
          nameError.classList.remove('hidden');
          productName.classList.add('form-error');
        } else {
          nameError.classList.add('hidden');
          productName.classList.remove('form-error');
        }
        validateForm();
      });

      // 设计故事字数统计
      designStory.addEventListener('input', (e) => {
        const length = e.target.value.length;
        storyCounter.textContent = `${length}/150`;
        
        if (length > 150) {
          storyCounter.classList.add('text-red-500');
          storyCounter.classList.remove('text-neutral-light');
        } else {
          storyCounter.classList.remove('text-red-500');
          storyCounter.classList.add('text-neutral-light');
        }
      });

      // 价格提示逻辑
      crowdfundPrice.addEventListener('input', (e) => {
        const price = parseFloat(e.target.value) || 0;
        if (price < 68) {
          minPriceHint.textContent = '⚠️ 价格低于工厂价¥68';
          minPriceHint.classList.remove('text-primary');
          minPriceHint.classList.add('text-red-500');
        } else {
          minPriceHint.textContent = '≥¥68';
          minPriceHint.classList.remove('text-red-500');
          minPriceHint.classList.add('text-primary');
        }
        validateForm();
      });

      // 主图上传
      mainImageUpload.addEventListener('click', () => {
        // 模拟选择了一张图片
        const mockImageUrl = 'https://picsum.photos/210/210'; // 使用占位图
        mainImgPreview.src = mockImageUrl;
        mainImagePreview.classList.remove('hidden');
        
        isMainImageUploaded = true;
        validateForm();

        // 为删除按钮添加事件
        mainImagePreview.querySelector('button').addEventListener('click', (e) => {
          e.stopPropagation();
          mainImagePreview.classList.add('hidden');
          mainImgPreview.src = '';
          isMainImageUploaded = false;
          validateForm();
        });
      });

      // 三视图上传
      threeViewsUpload.addEventListener('click', () => {
        // 模拟选择了三张图片
        const views = ['前视图', '侧视图', '后视图'];
        threeViewsPreview.innerHTML = '';
        
        views.forEach((view, index) => {
          const mockImageUrl = `https://picsum.photos/200/200?random=${index}`;
          const previewHTML = `
            <div class="relative group">
              <img src="${mockImageUrl}" alt="${view}" class="w-full aspect-square object-cover rounded border border-neutral-light/20">
              <div class="absolute bottom-0 left-0 right-0 bg-black/50 text-white text-xs text-center py-1">${view}</div>
              <button class="absolute top-1 right-1 bg-black/50 text-white rounded-full p-1 opacity-0 group-hover:opacity-100 transition-opacity">
                <i class="fa fa-times"></i>
              </button>
            </div>
          `;
          threeViewsPreview.innerHTML += previewHTML;
        });
        
        threeViewsPreview.classList.remove('hidden');
        isThreeViewsUploaded = true;
        validateForm();

        // 为删除按钮添加事件
        threeViewsPreview.querySelectorAll('button').forEach(btn => {
          btn.addEventListener('click', (e) => {
            e.stopPropagation();
            const parent = btn.closest('div');
            parent.remove();
            
            // 检查是否还有图片
            if (threeViewsPreview.children.length === 0) {
              threeViewsPreview.classList.add('hidden');
              isThreeViewsUploaded = false;
            }
            validateForm();
          });
        });
      });

      // 颜色选择功能
      colorSwatches.querySelectorAll('.color-swatch:not(#addColor)').forEach(swatch => {
        swatch.addEventListener('click', () => {
          const color = swatch.getAttribute('data-color');
          
          if (swatch.classList.contains('color-swatch-selected')) {
            // 取消选择
            swatch.classList.remove('color-swatch-selected');
            // 移除颜色标签
            const colorTags = selectedColors.querySelectorAll('span');
            colorTags.forEach(tag => {
              if (tag.textContent.trim().startsWith(color)) {
                tag.remove();
                selectedColorCount--;
              }
            });
          } else {
            // 检查是否已达最大数量
            if (selectedColorCount >= 3) {
              alert('最多只能选择3组颜色');
              return;
            }
            
            // 添加选择
            swatch.classList.add('color-swatch-selected');
            // 添加颜色标签
            const colorTag = document.createElement('span');
            colorTag.className = 'bg-neutral/10 text-sm px-2 py-1 rounded-full flex items-center';
            colorTag.innerHTML = `
              ${color}
              <button class="ml-1 text-neutral-light hover:text-red-500 remove-color">
                <i class="fa fa-times-circle text-xs"></i>
              </button>
            `;
            selectedColors.appendChild(colorTag);
            selectedColorCount++;
            
            // 为删除按钮添加事件
            colorTag.querySelector('.remove-color').addEventListener('click', (e) => {
              e.stopPropagation();
              colorTag.remove();
              swatch.classList.remove('color-swatch-selected');
              selectedColorCount--;
              validateForm();
            });
          }
          validateForm();
        });
      });

      // 添加颜色按钮
      addColor.addEventListener('click', () => {
        if (selectedColorCount >= 3) {
          alert('最多只能选择3组颜色');
          return;
        }
        
        // 模拟颜色选择器
        const newColor = '#' + Math.floor(Math.random()*16777215).toString(16).padStart(6, '0');
        
        // 创建新的颜色选择器
        const newSwatch = document.createElement('div');
        newSwatch.className = 'color-swatch color-swatch-selected';
        newSwatch.style.backgroundColor = newColor;
        newSwatch.setAttribute('data-color', newColor);
        
        // 插入到添加按钮前
        colorSwatches.insertBefore(newSwatch, addColor);
        
        // 添加颜色标签
        const colorTag = document.createElement('span');
        colorTag.className = 'bg-neutral/10 text-sm px-2 py-1 rounded-full flex items-center';
        colorTag.innerHTML = `
          ${newColor}
          <button class="ml-1 text-neutral-light hover:text-red-500 remove-color">
            <i class="fa fa-times-circle text-xs"></i>
          </button>
        `;
        selectedColors.appendChild(colorTag);
        selectedColorCount++;
        
        // 为新颜色块添加点击事件
        newSwatch.addEventListener('click', () => {
          newSwatch.classList.remove('color-swatch-selected');
          colorTag.remove();
          selectedColorCount--;
          validateForm();
        });
        
        // 为删除按钮添加事件
        colorTag.querySelector('.remove-color').addEventListener('click', () => {
          newSwatch.classList.remove('color-swatch-selected');
          colorTag.remove();
          selectedColorCount--;
          validateForm();
        });
        
        validateForm();
      });

      // 添加配件功能
      addAccessory.addEventListener('click', () => {
        const accessoryText = accessoryInput.value.trim();
        if (!accessoryText) return;
        
        // 创建配件标签
        const accessoryTag = document.createElement('span');
        accessoryTag.className = 'bg-neutral/10 text-sm px-2 py-1 rounded-full flex items-center';
        accessoryTag.innerHTML = `
          ${accessoryText}
          <button class="ml-1 text-neutral-light hover:text-red-500 remove-accessory">
            <i class="fa fa-times-circle text-xs"></i>
          </button>
        `;
        accessoryList.appendChild(accessoryTag);
        accessoryCount++;
        
        // 清空输入框
        accessoryInput.value = '';
        
        // 为删除按钮添加事件
        accessoryTag.querySelector('.remove-accessory').addEventListener('click', () => {
          accessoryTag.remove();
          accessoryCount--;
        });
      });

      // 材质和包装选择变化时验证
      materialSelect.addEventListener('change', validateForm);
      packagingSelect.addEventListener('change', validateForm);
      
      // 尺寸输入验证
      const dimensionInputs = [
        document.getElementById('productHeight'),
        document.getElementById('productWidth'),
        document.getElementById('productDepth')
      ];
      
      dimensionInputs.forEach(input => {
        input.addEventListener('input', () => {
          // 简单验证：必须为正数
          if (input.value && (parseFloat(input.value) <= 0 || isNaN(parseFloat(input.value)))) {
            input.classList.add('form-error');
          } else {
            input.classList.remove('form-error');
          }
          validateForm();
        });
      });

      // 模拟上传设计图 (在小程序中替换为 wx.chooseMedia)
      imgUploadArea.addEventListener('click', () => {
        // 模拟选择了一张图片
        const mockImageUrl = 'https://picsum.photos/200/200?random=10'; // 使用占位图
        const previewHTML = `
          <div class="relative group">
            <img src="${mockImageUrl}" alt="设计图预览" class="w-full h-20 object-cover rounded border border-neutral-light/20">
            <button class="absolute top-1 right-1 bg-black/50 text-white rounded-full p-1 opacity-0 group-hover:opacity-100 transition-opacity">
              <i class="fa fa-times"></i>
            </button>
          </div>
        `;
        imgPreviewContainer.innerHTML = previewHTML;
        imgPreviewContainer.classList.remove('hidden');
        
        isImageUploaded = true;
        validateForm();

        // 为删除按钮添加事件
        imgPreviewContainer.querySelector('button').addEventListener('click', (e) => {
          e.stopPropagation();
          imgPreviewContainer.innerHTML = '';
          imgPreviewContainer.classList.add('hidden');
          isImageUploaded = false;
          validateForm();
        });
      });

      // 模拟上传3D文件
      fileUploadArea.addEventListener('click', () => {
        const mockFileName = 'design.fbx';
        fileNameDisplay.textContent = mockFileName;
        fileInfoContainer.classList.remove('hidden');
      });

      // 模拟计算预计发货时间
      const calculateShipDate = (days) => {
        const baseDate = new Date('2025-10-31'); // 假设今天是众筹开始日
        baseDate.setDate(baseDate.getDate() + parseInt(days, 10) + 30); // 众筹天数 + 30天生产期
        const year = baseDate.getFullYear();
        const month = String(baseDate.getMonth() + 1).padStart(2, '0');
        const day = String(baseDate.getDate()).padStart(2, '0');
        return `${year}-${month}-${day}`;
      };

      campaignDays.addEventListener('change', (e) => {
        const newDate = calculateShipDate(e.target.value);
        estimatedShipDate.value = newDate;
      });

      // 协议勾选事件
      agreeTerms.addEventListener('change', validateForm);

      // 初始化
      validateForm();
    });
  </script>
</body>
</html>
